apply plugin: 'com.android.application'

// Release signing credentials live in android/keystore.properties, which is
// git-ignored. Without that file the project still builds (debug + unsigned
// release), so a fresh clone is never blocked on secrets.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def canSignRelease = keystorePropsFile.exists() &&
        rootProject.file(keystoreProps['storeFile'] ?: 'missing').exists()

android {
    namespace "com.trinity.hotelmanager"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.trinity.hotelmanager"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // The SQLite plugin ships a ~5 MB libsqlcipher.so per ABI. Real phones
        // are ARM, so dropping the x86 variants removes ~10 MB of dead weight.
        // Add 'x86_64' back if you need to run on an emulator.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (canSignRelease) {
                signingConfig signingConfigs.release
            } else {
                logger.warn('WARNING: android/keystore.properties missing - release build will be UNSIGNED.')
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Keep debug builds fast and fully inspectable.
            minifyEnabled false
        }
    }
    lint {
        abortOnError false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// NOTE: the google-services block from the Capacitor template was removed on
// purpose. This app uses no Google or cloud services of any kind.
